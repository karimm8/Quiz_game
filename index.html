<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body class="d-flex justify-content-center align-items-center bg-dark min-vh-100">
    <div class="container p-2 bg-light rounded-3 d-flex flex-column align-items-center" id="div1">
         <h1>Quiz Time!</h1>
         <p class="fw-light fs-5 text-dark text-center">Test your knowledge with these fun questions</p>
         <button class="btn btn-dark fs-3 fw-bold" id="start">Start</button>
    </div>
    <div class="container desactive p-2 bg-light rounded-3 d-flex flex-column align-items-center " id="div2">
        <h2 id="qst" class="text-center">

        </h2>
        <div class="d-flex justify-content-between "  style="width: 100%;">
            <h5>Question
                <span id="num_qst"></span>
                of
                <span id="total_qst_details"></span>
            </h5>
            <h5>
                Score: <span id="score"></span>
            </h5>
        </div>
        <div id="btns_answers" class="answers">

        </div>
        <div class="progress container mt-2" role="progressbar" aria-label="Basic example" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="parent_progress">
            <div class="progress-bar" style="width: 0%" id="child_progress"></div>
        </div>
    </div>
    <div class="container desactive p-2 bg-light rounded-3 d-flex flex-column align-items-center" id="result">
         <h1>Quiz Results</h1>
         <p>You scored <span id="total_score"></span> out of <span id="total_qst_result"></span></p>
         <h3><span id="observe"></span> Try again</h3>
         <button class="btn btn-dark fs-3 fw-bold" onclick="restart()">Restart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
